services:
- type: web
  name: stock-management
  env: node
  buildCommand: npm install && npm run build
  startCommand: node server.js
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: stock_0gr5
      property: connectionString
  - key: NODE_ENV
    value: production

databases:
- name: stock_0gr5
  databaseName: stock_0gr5
  user: stock_0gr5_user
